name: Release

# bk had no release workflow while pkgx, pkgm and mirror did, so its tags ran
# ahead of its Releases page: v0.7.0 tagged, v0.5.0 the newest release anybody
# browsing the repository could see. Go resolves a module by TAG, so nothing
# was broken for a consumer who imports bk — and everything was wrong for a
# person who wanted the binary.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.7.0). Must already exist."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # creating the release and uploading its files
      id-token: write      # the attestation's Sigstore certificate
      attestations: write  # recording it
    steps:
      # fetch-depth: 0, and it is not caution. Go stamps a binary's module
      # version from the VCS state it builds in, which is what makes
      # `bk lock` able to record WHICH bk wrote a lock. A shallow checkout
      # can leave the tag unreachable and the stamp becomes a pseudo-version,
      # so the release would ship binaries that misreport themselves.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'

      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            git checkout "$tag"
          else
            tag="$REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The same targets ci.yml builds, so a release cannot carry a platform
      # the matrix never compiled. Six linux arches because the factory runs
      # on all of them -- s390x, ppc64le, riscv64 and loong64 are not
      # curiosities here, they are lanes with artifacts.
      # ⛔ dist/ MUST NOT LIVE IN THE CHECKOUT. Go stamps the main module
      # from the work tree's VCS state, so the moment the first binary lands
      # in an untracked dist/ the tree is dirty and every LATER build in this
      # loop is stamped `+dirty`.
      #
      # An EMPTY directory is invisible to git, so `mkdir dist` alone is
      # harmless — it is the first `-o dist/...` that does it. Which is why
      # the FIRST target of the loop comes out clean and the other thirteen
      # do not. See the guard below for what that cost.
      - name: Build release binaries
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          DIST="$RUNNER_TEMP/dist"
          mkdir -p "$DIST"
          for target in \
            linux/amd64 linux/arm64 linux/riscv64 \
            linux/ppc64le linux/s390x linux/loong64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 \
            freebsd/amd64 freebsd/arm64 netbsd/amd64 openbsd/amd64; do
            os=${target%/*}
            arch=${target#*/}
            out="zpkb-${os}-${arch}"
            if [ "$os" = "windows" ]; then
              out="${out}.exe"
            fi
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "$DIST/${out}" ./cmd/zpkb

            # venvlaunch is the entry point `bkpyvenv seal` installs into a
            # python-venv artifact (cmd/venvlaunch, go-zpkg/zpkgx#151). It ships
            # here, from the same matrix and into the same SHA256SUMS, because
            # a pantry recipe can then pin a STORED asset with an
            # upstream-attested digest — where the generated tag archive 1111
            # of 1932 upstream recipes use cannot be pinned at all
            # (go-zpkg/packages#420).
            #
            # ⛔⛔ NOT FOR WINDOWS, AND "IT COMPILES" IS A FALSE WITNESS HERE.
            # GOOS=windows builds it cleanly, because Go declares the symbol —
            # and syscall/exec_windows.go:453 is
            #
            #     func Exec(argv0 string, argv []string, envv []string) error {
            #         return EWINDOWS
            #     }
            #
            # so the binary would start and then always fail. Publishing it
            # would promise a platform this cannot serve, which is worse than
            # omitting it. The venv layout it walks is POSIX bin/ anyway.
            if [ "$os" != "windows" ]; then
              echo "building venvlaunch-${os}-${arch}"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath -ldflags="-s -w" \
                  -o "$DIST/venvlaunch-${os}-${arch}" ./cmd/venvlaunch
            fi
          done
          cd "$DIST"
          sha256sum zpkb-* venvlaunch-* > SHA256SUMS
          cat SHA256SUMS

      # An ASSERTION, not a hope. bk writes its own module version into every
      # lock it produces (`bk = "v0.7.0"`), read from debug.ReadBuildInfo, and
      # a binary whose stamp does not match the tag would put a lie in every
      # lock taken with it. Measured before this workflow was written: a clean
      # build at a tagged commit stamps the tag, and a dirty tree stamps
      # `v0.6.2-0.2026…+dirty` instead -- so this can fail, and when it does
      # the fix is -ldflags "-X", not a shrug.
      #
      # `go version -m` is the same idiom go-zpkg/packages already uses to
      # record which bk built an artifact.
      # ⛔⛔ THE BINARIES. PLURAL. This step was already an EXACT equality,
      # and it passed for thirteen releases while shipping dirty binaries,
      # because of WHICH FILE it read:
      #
      #   bk-linux-amd64    v0.14.8          ← the one it checked
      #   bk-linux-arm64    v0.14.8+dirty
      #   bk-darwin-arm64   v0.14.8+dirty
      #   bk-linux-s390x    v0.14.8+dirty
      #
      # bk-linux-amd64 is the FIRST target of the loop above — built before
      # anything had been written into dist/, so it is the only one of the
      # fourteen that could never be dirty. The assertion was right, the
      # sample was the one that cannot show the defect.
      #
      # Measured 2026-10-09 on the published v0.14.8 assets, after a peer
      # session reported the same shape in go-authn.
      - name: The binaries must say which version they are
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          DIST="$RUNNER_TEMP/dist"
          bad=0
          # ⛔ venvlaunch-* IS IN THIS GLOB ON PURPOSE. The lesson recorded
          # above is that this assertion once read one file out of fourteen;
          # adding a second binary to the release without adding it here would
          # repeat that in a new shape. It is the same module, so it carries
          # the same stamp, and the dirty-tree check matters for it exactly as
          # much: a launcher built from an unknown tree is one nobody can
          # trace, and it ends up inside every python-venv artifact.
          for bin in "$DIST"/zpkb-* "$DIST"/venvlaunch-*; do
            name=$(basename "$bin")
            info=$(go version -m "$bin")
            stamped=$(printf '%s\n' "$info" | awk '$1=="mod" {print $3; exit}')
            echo "$name: $stamped"
            if [ "$stamped" != "$TAG" ]; then
              echo "::error::$name stamps $stamped but this is $TAG — a zpkb build would name the wrong version in every lock it writes, and a venvlaunch build would be untraceable inside the artifacts it ships in"
              bad=1
            fi
            if printf '%s\n' "$info" | grep -q 'vcs\.modified=true'; then
              echo "::error::$name: vcs.modified=true — it was built from a dirty tree"
              bad=1
            fi
          done
          # AND THE VERSION IT PRINTS. Until now it had no way to say which
          # build it was — `--version` was "flag provided but not defined"
          # and `version` was "unknown command" — so this half could not
          # be checked at all.
          #
          # It is not a duplicate of the loop above even though both read
          # debug.ReadBuildInfo: this one proves the COMMAND works, on the
          # binary a user will actually run. A wiring break (missing case,
          # wrong field, output to stderr) is invisible to `go version -m`.
          got=$("$DIST/zpkb-linux-amd64" version | awk '{print $2}')
          if [ "$got" != "$TAG" ]; then
            echo "::error::zpkb version says '$got', want exactly '$TAG'"
            bad=1
          fi
          exit "$bad"

      # ⛔ WITHOUT THIS, NOTHING CONNECTS A PUBLISHED BINARY TO ITS BUILD.
      # SHA256SUMS is a checksum of itself: it says the binaries match a
      # manifest published beside them, and whoever replaced the binaries
      # would replace the manifest. A provenance attestation is the half
      # that cannot be forged from the release page — GitHub signs, through
      # Sigstore, a statement that THIS workflow built THAT file from THAT
      # commit, and `gh attestation verify -R go-zpkg/bk <file>` checks it.
      #
      # Measured 2026-10-20 on go-zpkg/pkgx v0.23.1, with go-fleettools'
      # relverify: twelve files, every checksum right, and every attestation
      # lookup `HTTP 404: Not Found`. The same was true here, and of
      # go-zpkg/pkgm and go-zpkg/mirror — one organisation publishing
      # binaries that verify as far as a manifest can take them and no
      # further. go-fileshare/fileshare has had this step since its v0.29
      # series.
      #
      # It runs AFTER the version guard and BEFORE publishing: nothing
      # mis-stamped is ever attested, and nothing unattested is ever
      # published.
      - name: Attest the binaries and the manifest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ runner.temp }}/dist/zpkb-*
            ${{ runner.temp }}/dist/venvlaunch-*
            ${{ runner.temp }}/dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          DIST="$RUNNER_TEMP/dist"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DIST"/* --clobber
          else
            gh release create "$TAG" "$DIST"/* \
              --title "$TAG" \
              --notes "Static, dependency-free \`zpkb\` binaries (CGO_ENABLED=0) for six linux architectures, darwin, windows and the BSDs, and \`venvlaunch\` for the same targets except windows — the entry point \`bkpyvenv seal\` installs into a python-venv artifact, which needs no interpreter of its own to start. Verify downloads against SHA256SUMS; every file here also carries a Sigstore provenance attestation (\`gh attestation verify -R go-zpkg/zpkb <file>\`). Each \`zpkb\` binary reports its own version into every lock it writes."
          fi
